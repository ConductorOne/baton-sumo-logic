name: ci
on: pull_request

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m

  go-test:
    strategy:
      matrix:
        go-version: [1.24.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        if: success()
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: go tests
        run: (set -o pipefail && go test -v -covermode=count -json ./... | tee test.json)
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_API_BASE_URL: https://api.sumologic.com
      BATON_API_ACCESS_ID: ${{ secrets.API_ACCESS_ID }}
      BATON_API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
      BATON_INCLUDE_SERVICE_ACCOUNTS: true
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install baton
        run: ./scripts/get-baton.sh && sudo mv baton /usr/local/bin

      - name: Build baton-sumo-logic
        run: go build ./cmd/baton-sumo-logic

      - name: Test Account Provisioning
        uses: ConductorOne/github-workflows/actions/account-provisioning@v3
        with:
          connector: ./baton-sumo-logic
          account-email: "test-${{ github.run_id }}@example.com"
          account-profile: >-
            {
              "email": "test-${{ github.run_id }}@example.com",
              "first_name": "Baton",
              "last_name": "CI-Test",
              "default_role_id": "0000000000C05D05"
            }

 